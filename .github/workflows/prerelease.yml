name: Create Prerelease
run-name: Prerelease ${{ inputs.version }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Prerelease version without a v prefix (e.g. 14.1.1-rc.1 or 14.1.1-beta.2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      channel: prerelease
      version: ${{ inputs.version }}
