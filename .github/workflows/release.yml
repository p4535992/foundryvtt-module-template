name: Create Release
run-name: Release ${{ inputs.version }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without a v prefix (e.g. 14.1.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      channel: stable
      version: ${{ inputs.version }}
