name: Create Release
run-name: Release ${{ inputs.version }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version to publish, for example 14.0.0 or v14.0.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ inputs.version }}
      channel: stable
